<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle Marathon (No Repeats)</title>
    <style>
        /* --- COLORS & THEME (Dark/Hard Mode) --- */
        :root {
            --bg-color: #201c29;       
            --text-color: #e8e6e3;     
            --tile-border: #4d465e;    
            --tile-bg: #201c29;
            --key-bg: #4d465e;         
            
            /* Status Colors */
            --correct-green: #6aaa64;
            --present-yellow: #c9b458;
            --absent-grey: #302a3d;
            
            /* Buttons */
            --hint-btn-bg: #905ac4;
            --hint-text-bg: #352e42;
            --new-game-btn: #6aaa64;
            --reset-btn-bg: #e74c3c; /* Red for reset */
        }

        /* --- BASIC LAYOUT --- */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh; 
            margin: 0;
            overflow: hidden; 
        }

        /* --- HEADER --- */
        header {
            border-bottom: 1px solid var(--tile-border);
            width: 100%;
            text-align: center;
            padding: 10px 0;
            flex-shrink: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; font-weight: 700; }

        /* --- SCROLLABLE BOARD AREA --- */
        #board-container {
            flex-grow: 1;           
            width: 100%;
            overflow-y: auto;       
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
            scrollbar-width: thin;
            scrollbar-color: var(--tile-border) var(--bg-color);
        }

        #board { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 5px; padding-bottom: 50px; }

        .tile {
            width: 50px; height: 50px;
            border: 2px solid var(--tile-border);
            display: inline-flex; justify-content: center; align-items: center;
            font-size: 1.8rem; font-weight: bold; text-transform: uppercase;
        }

        /* --- KEYBOARD --- */
        #keyboard-container {
            width: 100%; max-width: 500px; padding: 10px 8px;
            flex-shrink: 0; background-color: var(--bg-color);
            border-top: 1px solid var(--tile-border);
        }

        .keyboard-row { display: flex; width: 100%; margin: 0 auto 8px; }

        .key {
            border: 0; padding: 0; margin: 0 3px 0 0; height: 54px; border-radius: 4px;
            cursor: pointer; background-color: var(--key-bg); color: var(--text-color);
            flex: 1; display: flex; justify-content: center; align-items: center;
            text-transform: uppercase; font-weight: bold;
        }
        .key.large { flex: 1.5; font-size: 0.8rem; }
        
        /* --- CONTROL SECTION --- */
        #control-section { margin-top: 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .action-btn { border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 0.75rem; font-weight: bold; color: white; }
        #hint-btn { background-color: var(--hint-btn-bg); }
        #restart-btn { background-color: var(--new-game-btn); display: none; }
        #reset-btn { background-color: var(--reset-btn-bg); }
        
        #clue-display { margin-top: 5px; padding: 5px 10px; background-color: var(--hint-text-bg); border-radius: 5px; display: none; border: 1px solid #565758; font-size: 0.9rem; }
        #progress-info { font-size: 0.7rem; color: #818384; }

        /* Messages & Animations */
        #message-container { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); z-index: 100; }
        .message { background-color: var(--text-color); color: var(--bg-color); padding: 10px 20px; border-radius: 5px; font-weight: bold; display: none; }
        .tile.flip { animation: flip 0.5s ease; }
        @keyframes flip { 50% { transform: rotateX(90deg); } }
        .tile[data-state="correct"] { background-color: var(--correct-green); border-color: var(--correct-green); color: white; }
        .tile[data-state="present"] { background-color: var(--present-yellow); border-color: var(--present-yellow); color: white; }
        .tile[data-state="absent"] { background-color: var(--absent-grey); border-color: var(--absent-grey); color: white; }
    </style>
</head>
<body>

    <header>
        <h1>MYSTERY WORDLE</h1>
        <div id="control-section">
            <div style="display:flex; gap:10px;">
                <button id="hint-btn" class="action-btn" onclick="toggleHint()">💡 CLUE</button>
                <button id="restart-btn" class="action-btn" onclick="location.reload()">🔄 Main Lagi</button>
                <button id="reset-btn" class="action-btn" onclick="resetMarathon()">🗑️ Reset Progres</button>
            </div>
            <div id="clue-display"></div>
            <div id="progress-info"></div>
        </div>
    </header>

    <div id="message-container"></div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <div id="keyboard-container">
        <div class="keyboard-row">
            <button class="key" data-key="q">q</button><button class="key" data-key="w">w</button>
            <button class="key" data-key="e">e</button><button class="key" data-key="r">r</button>
            <button class="key" data-key="t">t</button><button class="key" data-key="y">y</button>
            <button class="key" data-key="u">u</button><button class="key" data-key="i">i</button>
            <button class="key" data-key="o">o</button><button class="key" data-key="p">p</button>
        </div>
        <div class="keyboard-row">
            <button class="key" data-key="a">a</button><button class="key" data-key="s">s</button>
            <button class="key" data-key="d">d</button><button class="key" data-key="f">f</button>
            <button class="key" data-key="g">g</button><button class="key" data-key="h">h</button>
            <button class="key" data-key="j">j</button><button class="key" data-key="k">k</button>
            <button class="key" data-key="l">l</button>
        </div>
        <div class="keyboard-row">
            <button class="key large" data-key="Enter">Kirim</button>
            <button class="key" data-key="z">z</button><button class="key" data-key="x">x</button>
            <button class="key" data-key="c">c</button><button class="key" data-key="v">v</button>
            <button class="key" data-key="b">b</button><button class="key" data-key="n">n</button>
            <button class="key" data-key="m">m</button>
            <button class="key large" data-key="Backspace">⌫</button>
        </div>
    </div>

<script>
const GAME_DATA = [
    { word: "ACUAN", clue: "Referensi atau rujukan" },
    { word: "ASING", clue: "Bukan dari sini, aneh, tidak dikenal" },
    { word: "BAGAN", clue: "Skema, kerangka, atau grafik" },
    { word: "BAZAR", clue: "Pasar amal atau pameran dagang" },
    { word: "BEBAL", clue: "Sukar mengerti, keras kepala" },
    { word: "BURAM", clue: "Tidak jernih, samar-samar" },
    { word: "CACAT", clue: "Kekurangan, tidak sempurna" },
    { word: "CANDU", clue: "Sesuatu yang membuat ketagihan" },
    { word: "CORAK", clue: "Motif, gaya, atau warna dasar" },
    { word: "DEBUT", clue: "Penampilan perdana/pertama kali" },
    { word: "FAKTA", clue: "Hal yang benar-benar terjadi" },
    { word: "FATWA", clue: "Keputusan/pendapat hukum agama" },
    { word: "FAKIR", clue: "Orang yang sangat miskin" },
    { word: "GABAH", clue: "Bulir padi yang kulitnya belum terkelupas" },
    { word: "GAMIS", clue: "Pakaian panjang ala Timur Tengah" },
    { word: "GESIT", clue: "Cekatan, tidak lamban" },
    { word: "GUSAR", clue: "Perasaan marah bercampur sedih/khawatir" },
    { word: "HAYAT", clue: "Hidup atau nyawa" },
    { word: "IMBAS", clue: "Dampak atau efek pantulan" },
    { word: "JAKSA", clue: "Orang yang menuntut di pengadilan" },
    { word: "JUANG", clue: "Usaha keras (lawan kata menyerah)" },
    { word: "KABUT", clue: "Uap air yang menghalangi pandangan" },
    { word: "KELAM", clue: "Agak gelap, suram, tidak cerah" },
    { word: "LAZIM", clue: "Sudah biasa, umum, lumrah" },
    { word: "LIGAT", clue: "Berputar cepat atau sangat lincah" },
    { word: "LULUH", clue: "Hancur menjadi serbuk / Hati yang meleleh" },
    { word: "MAGIS", clue: "Bersifat sihir atau gaib" },
    { word: "NYAWA", clue: "Unsur hidup dalam tubuh" },
    { word: "OBJEK", clue: "Sasaran atau hal yang dibicarakan" },
    { word: "PAKAR", clue: "Ahli di bidangnya (spesialis)" },
    { word: "PEKAT", clue: "Kental sekali atau gelap gulita" },
    { word: "PIHAK", clue: "Sisi, golongan, atau orang yang berkepentingan" },
    { word: "POROS", clue: "Sumbu putar, pusat, atau as roda" },
    { word: "RAWAN", clue: "Mudah menimbulkan gangguan/bahaya" },
    { word: "RITUS", clue: "Tata cara dalam upacara keagamaan" },
    { word: "SENDU", clue: "Sedih, pilu, berdukacita" },
    { word: "TAJAM", clue: "Bisa melukai, atau pikiran yang cerdas" },
    { word: "TEGAR", clue: "Keras hati, tabah menghadapi masalah" },
    { word: "USANG", clue: "Sudah lama, kuno, dan rusak" },
    { word: "WABAH", clue: "Penyakit yang menyebar luas dengan cepat" },
    { word: "YAKIN", clue: "Percaya sungguh-sungguh" },
    { word: "ZAKAT", clue: "Harta yang wajib dikeluarkan umat Islam" },
    { word: "ZALIM", clue: "Bengis, kejam, tidak adil" },
    { word: "ANDIL", clue: "Kontribusi nyata warga negara dalam pembangunan" },
    { word: "IDEAL", clue: "Kondisi tatanan negara yang dicita-citakan bersama" },
    { word: "BADAN", clue: "Lembaga atau organisasi resmi milik pemerintah" },
    { word: "BANTU", clue: "Program dukungan sosial bagi masyarakat membutuhkan" },
    { word: "DASAR", clue: "Landasan hukum atau pijakan sebuah aturan negara" },
    { word: "DEBAT", clue: "Ruang adu gagasan dan visi antar calon pemimpin" },
    { word: "DUNIA", clue: "Lingkup kerja sama internasional antar bangsa" },
    { word: "ETIKA", clue: "Nilai moral yang dijunjung tinggi dalam bernegara" },
    { word: "FORUM", clue: "Wadah pertemuan untuk bermusyawarah dan mufakat" },
    { word: "GAGAS", clue: "Menyampaikan ide kreatif demi kemajuan daerah" },
    { word: "UTAMA", clue: "Skala prioritas dalam pengambilan kebijakan publik" },
    { word: "HASIL", clue: "Capaian nyata dari pelaksanaan program kerja" },
    { word: "BAKTI", clue: "Bentuk pengabdian seseorang kepada nusa dan bangsa" },
    { word: "JALUR", clue: "Mekanisme atau prosedur resmi yang sah secara hukum" },
    { word: "KADER", clue: "Individu yang disiapkan menjadi pemimpin masa depan" }
];

const MAX_GUESSES = 18;
const WORD_LENGTH = 5;
const STORAGE_KEY = 'sandikata_played_words';

let currentGuess = "";
let remainingGuesses = MAX_GUESSES;
let targetWord = "";
let gameOver = false;

function initGame() {
    let playedWords = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let availableWords = GAME_DATA.filter(item => !playedWords.includes(item.word));

    document.getElementById("progress-info").textContent = 
        `Kata terselesaikan: ${playedWords.length} / ${GAME_DATA.length}`;

    if (availableWords.length === 0) {
        showMessage("Semua kata sudah selesai!");
        return; 
    }

    const randomIndex = Math.floor(Math.random() * availableWords.length);
    const selectedData = availableWords[randomIndex];
    
    targetWord = selectedData.word.toUpperCase();
    document.getElementById("clue-display").textContent = selectedData.clue;
    
    createBoard();
    setupKeyboard();
}

// THE RESET FUNCTION
function resetMarathon() {
    if (confirm("Hapus semua progres dan mulai dari awal?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
}

function saveProgress(word) {
    let playedWords = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    if (!playedWords.includes(word)) {
        playedWords.push(word);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(playedWords));
    }
}

function toggleHint() {
    const display = document.getElementById("clue-display");
    const btn = document.getElementById("hint-btn");
    display.style.display = (display.style.display === "none" || display.style.display === "") ? "block" : "none";
    btn.textContent = display.style.display === "block" ? "🙈 Sembunyikan" : "💡 Lihat Petunjuk";
}

function createBoard() {
    const board = document.getElementById("board");
    board.innerHTML = ''; 
    for (let i = 0; i < MAX_GUESSES; i++) {
        for (let j = 0; j < WORD_LENGTH; j++) {
            let tile = document.createElement("div");
            tile.classList.add("tile");
            tile.setAttribute("id", `row-${i}-tile-${j}`);
            board.appendChild(tile);
        }
    }
}

function setupKeyboard() {
    document.querySelectorAll(".key").forEach(key => {
        key.addEventListener("click", (e) => {
            if (gameOver) return;
            const keyVal = e.target.getAttribute("data-key");
            if (keyVal === "Enter") checkGuess();
            else if (keyVal === "Backspace") deleteLetter();
            else insertLetter(keyVal);
        });
    });
}

function insertLetter(key) {
    if (currentGuess.length < WORD_LENGTH) {
        currentGuess += key.toUpperCase();
        let row = MAX_GUESSES - remainingGuesses;
        let tile = document.getElementById(`row-${row}-tile-${currentGuess.length - 1}`);
        tile.textContent = key.toUpperCase();
    }
}

function deleteLetter() {
    if (currentGuess.length > 0) {
        let row = MAX_GUESSES - remainingGuesses;
        let tile = document.getElementById(`row-${row}-tile-${currentGuess.length - 1}`);
        tile.textContent = "";
        currentGuess = currentGuess.slice(0, -1);
    }
}

function checkGuess() {
    if (currentGuess.length !== WORD_LENGTH) return;

    let row = MAX_GUESSES - remainingGuesses;
    let guessArray = Array.from(currentGuess);
    let targetArray = Array.from(targetWord);
    
    // Logic for coloring tiles (Green/Yellow/Grey)
    for (let i = 0; i < WORD_LENGTH; i++) {
        let tile = document.getElementById(`row-${row}-tile-${i}`);
        let letter = guessArray[i];
        if (letter === targetArray[i]) {
            tile.setAttribute("data-state", "correct");
            targetArray[i] = null;
            guessArray[i] = null;
        }
    }

    for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessArray[i] === null) continue;
        let tile = document.getElementById(`row-${row}-tile-${i}`);
        let index = targetArray.indexOf(guessArray[i]);
        if (index !== -1) {
            tile.setAttribute("data-state", "present");
            targetArray[index] = null;
        } else {
            tile.setAttribute("data-state", "absent");
        }
        tile.classList.add("flip");
    }

    if (currentGuess === targetWord) {
        showMessage("Luar Biasa!");
        gameOver = true;
        saveProgress(targetWord);
        showRestartBtn();
    } else {
        remainingGuesses--;
        if (remainingGuesses === 0) {
            showMessage(`Kalah! Jawabannya: ${targetWord}`);
            gameOver = true;
            showRestartBtn();
        }
    }
    currentGuess = "";
}

function showRestartBtn() {
    setTimeout(() => {
        document.getElementById("restart-btn").style.display = "inline-block";
        document.getElementById("hint-btn").style.display = "none";
    }, 1000);
}

function showMessage(text) {
    const msgContainer = document.getElementById("message-container");
    const msg = document.createElement("div");
    msg.classList.add("message");
    msg.textContent = text;
    msg.style.display = "block";
    msgContainer.innerHTML = ''; 
    msgContainer.appendChild(msg);
}

initGame();
</script>
</body>
</html>
